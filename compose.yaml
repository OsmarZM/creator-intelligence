services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: creator
      POSTGRES_DB: creator_intelligence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    volumes:
      - creator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  creator_pgdata:
